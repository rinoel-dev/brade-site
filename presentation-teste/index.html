<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apresentação Rinoel Marinho (teste)</title>
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Apresentação BRADE">
<meta property="og:description" content="Acompanhe os slides em tempo real">
<meta property="og:image" content="https://rinoel.com.br/presentation/cover.png">
<meta property="og:url" content="https://rinoel.com.br/presentation">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #161616;
      --border: #262626;
      --text: #f5f5f5;
      --muted: #737373;
      --accent: #fbbf24;
      --font-display: 'Fraunces', serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow: hidden;
    }
    .presenter-app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: minmax(0, 1fr);
      height: 100vh;
      height: 100dvh; /* no celular, desconta as barras do navegador */
    }
    .presenter-app > * { min-width: 0; }
    .share-box, .share-box .url { min-width: 0; }
    .presenter-app.with-notes {
      grid-template-columns: minmax(0, 1fr) minmax(300px, 32vw);
      grid-template-areas:
        "top top"
        "stage notes"
        "controls notes";
    }
    .presenter-app.with-notes .topbar { grid-area: top; }
    .presenter-app.with-notes .stage { grid-area: stage; }
    .presenter-app.with-notes .controls { grid-area: controls; }
    .notes {
      grid-area: notes;
      display: none;
      flex-direction: column;
      border-left: 1px solid var(--border);
      background: var(--surface);
      min-height: 0;
    }
    .presenter-app.with-notes .notes { display: flex; }
    .notes-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .notes-title {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .notes-title strong { color: var(--accent); font-weight: 500; }
    .notes-status {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .notes-status.error { color: #ef4444; }
    .notes-size {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      width: 30px;
      height: 28px;
      border-radius: 5px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    .notes-size:hover { border-color: var(--accent); color: var(--accent); }
    .notes textarea {
      flex: 1;
      min-height: 0;
      width: 100%;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      padding: 16px 18px 24px;
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.55;
    }
    .notes textarea::placeholder { color: #525252; }
    @media (max-width: 900px) {
      .presenter-app.with-notes {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr) auto minmax(200px, 42%);
        grid-template-areas: "top" "stage" "controls" "notes";
      }
      .notes { border-left: 0; border-top: 1px solid var(--border); }
      .video-hint { display: none; }
      .controls { padding: 12px 16px; }
    }
    .topbar {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 18px;
      color: var(--accent);
      letter-spacing: -0.01em;
      flex-shrink: 0;
    }
    .share-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 6px 6px 14px;
      border-radius: 8px;
      max-width: 720px;
    }
    .share-box .label {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.1em;
      flex-shrink: 0;
    }
    .share-box .url {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .share-box button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 5px;
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .share-box button:hover {
      background: var(--accent);
      color: #0a0a0a;
      border-color: var(--accent);
    }
    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      background: #050505;
      position: relative;
    }
    .slide-canvas-wrapper {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
      line-height: 0;
    }
    canvas { display: block; max-width: 100%; height: auto; }
    .controls {
      padding: 18px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .nav-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .nav-btn:hover:not(:disabled) {
      background: var(--accent);
      color: #0a0a0a;
      border-color: var(--accent);
    }
    .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    .counter {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--muted);
      min-width: 80px;
      text-align: center;
    }
    .counter strong { color: var(--text); font-weight: 500; }
    .viewer-app {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #050505;
      padding: 16px;
      position: relative;
    }
    .viewer-app .slide-canvas-wrapper {
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    }
    .viewer-status {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      background: rgba(22,22,22,0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s ease-in-out infinite;
    }
    .pulse.disconnected { background: #ef4444; animation: none; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); }
      70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    .loading, .error-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: var(--font-mono);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 24px;
      gap: 12px;
    }
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--accent);
      color: #0a0a0a;
      padding: 12px 22px;
      border-radius: 100px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 1000;
      box-shadow: 0 10px 40px rgba(251, 191, 36, 0.3);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 720px) {
      .topbar { flex-direction: column; gap: 10px; align-items: stretch; padding: 12px; }
      .share-box { max-width: none; }
      .brand { text-align: center; }
    }
    .slide-video {
      display: none;
      max-width: 100%;
      max-height: 100%;
      background: #000;
      border-radius: 4px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .slide-video.active { display: block; }
    .slide-canvas-wrapper.hidden { display: none; }
    .viewer-app .slide-video { max-height: calc(100vh - 32px); }
    .stage .slide-video { max-height: 100%; }
    .presenter-app .stage { min-height: 0; }
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(5,5,5,0.92);
      z-index: 500;
      text-align: center;
      padding: 24px;
    }
    .overlay .title {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 26px;
      color: var(--accent);
    }
    .overlay .sub {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .overlay button, .sound-btn {
      background: var(--accent);
      color: #0a0a0a;
      border: 0;
      padding: 14px 26px;
      border-radius: 100px;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    .sound-btn {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 400;
      display: none;
    }
    .sound-btn.show { display: block; }
    .video-hint {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div id="app"><div class="loading">Carregando...</div></div>
  <div id="toast" class="toast"></div>

  <script>
    // ===== Configuração =====
    const MEDIA_DIR = '../presentation/'; // PDF e vídeos ficam na pasta da apresentação oficial
    const PDF_FILE = MEDIA_DIR + 'slides.pdf';
    const NTFY_SERVER = 'https://ntfy.sh';
    // Sincronização principal (Firebase Realtime Database). Vazio = usa só o ntfy.
    // Se o Firebase falhar, a página cai automaticamente para o ntfy.
    const FIREBASE_URL = 'https://brade-slides-default-rtdb.firebaseio.com';
    const TOPIC_PREFIX = 'brade-slides-sync';

    // Vídeos inseridos entre os slides do PDF.
    // "after: 14" = o vídeo entra depois do slide 14 do PDF.
    const VIDEOS = [
      { after: 14, src: 'depo1.mp4' },
      { after: 14, src: 'depo2.mp4' },
      { after: 18, src: 'simulacao.mp4' }
    ];

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ===== Estado =====
    const hashSession = window.location.hash.substring(1).trim();
    const isViewer = hashSession.length > 0;
    let session = isViewer ? hashSession : generateSessionId();

    let pdfDoc = null;
    let deck = [];          // [{ type: 'pdf', page } | { type: 'video', src }]
    let currentPage = 1;    // posição no deck (1-based)
    let totalPages = 0;
    let isRendering = false;
    let pendingPage = null;
    let eventSource = null;
    let resizeTimer = null;
    const videoEls = {};    // src -> <video>
    let suppressBroadcast = false;
    let videoBroadcastTimer = null;

    function generateSessionId() {
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID().replace(/-/g, '').substring(0, 12);
      }
      return Math.random().toString(36).substring(2, 10) + Date.now().toString(36).substring(0, 4);
    }

    function getTopic() { return `${TOPIC_PREFIX}-${session}`; }

    function buildViewerUrl() {
      const path = window.location.pathname.replace(/\/$/, '');
      return `${window.location.origin}${path}#${session}`;
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast('Link copiado');
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast('Link copiado'); } catch (e) {}
        document.body.removeChild(ta);
      }
    }

    function buildDeck(numPages) {
      const items = [];
      VIDEOS.filter(v => v.after === 0).forEach(v => items.push({ type: 'video', src: v.src }));
      for (let p = 1; p <= numPages; p++) {
        items.push({ type: 'pdf', page: p });
        VIDEOS.filter(v => v.after === p).forEach(v => items.push({ type: 'video', src: v.src }));
      }
      return items;
    }

    async function loadPdf() {
      pdfDoc = await pdfjsLib.getDocument(PDF_FILE).promise;
      deck = buildDeck(pdfDoc.numPages);
      totalPages = deck.length;
    }

    // ===== Vídeos =====
    function createVideoElements(container) {
      VIDEOS.forEach(v => {
        const el = document.createElement('video');
        el.className = 'slide-video';
        el.src = MEDIA_DIR + v.src;
        el.preload = isViewer ? 'auto' : 'metadata';
        el.playsInline = true;
        el.setAttribute('playsinline', '');
        el.setAttribute('webkit-playsinline', '');
        if (!isViewer) {
          el.controls = true;
          ['play', 'pause', 'seeked'].forEach(evt =>
            el.addEventListener(evt, () => {
              if (suppressBroadcast) return;
              // Só o vídeo que está na tela conta (sair de um vídeo não gera mensagem)
              if (!el.classList.contains('active')) return;
              if (evt === 'seeked' && el._autoSeek) { el._autoSeek = false; return; }
              // Agrupa eventos em sequência (ex.: arrastar a barra) numa mensagem só
              clearTimeout(videoBroadcastTimer);
              videoBroadcastTimer = setTimeout(broadcastState, 300);
            })
          );
        }
        container.appendChild(el);
        videoEls[v.src] = el;
      });
    }

    function currentItem() { return deck[currentPage - 1]; }

    function currentVideo() {
      const item = currentItem();
      return item && item.type === 'video' ? videoEls[item.src] : null;
    }

    function videoState() {
      const v = currentVideo();
      if (!v) return null;
      return { playing: !v.paused && !v.ended, time: v.currentTime };
    }

    async function renderPage(pageNum) {
      if (!pdfDoc) return;
      if (pageNum < 1 || pageNum > totalPages) return;
      if (isRendering) { pendingPage = pageNum; return; }

      isRendering = true;
      const changed = pageNum !== currentPage;
      currentPage = pageNum;

      const canvas = document.getElementById('pdf-canvas');
      if (!canvas) { isRendering = false; return; }
      const wrapper = canvas.parentElement;
      const item = deck[pageNum - 1];

      suppressBroadcast = true;
      Object.entries(videoEls).forEach(([src, el]) => {
        const active = item.type === 'video' && item.src === src;
        el.classList.toggle('active', active);
        if (!active && !el.paused) el.pause();
        if (active && changed && el.currentTime > 0) {
          if (!isViewer) el._autoSeek = true;
          try { el.currentTime = 0; } catch (e) {}
        }
      });
      suppressBroadcast = false;

      if (item.type === 'video') {
        wrapper.classList.add('hidden');
      } else {
        wrapper.classList.remove('hidden');
        const page = await pdfDoc.getPage(item.page);
        const stage = wrapper.parentElement;
        const stageRect = stage.getBoundingClientRect();
        const padding = 40;
        const availW = Math.max(200, stageRect.width - padding);
        const availH = Math.max(200, stageRect.height - padding);

        const baseViewport = page.getViewport({ scale: 1 });
        const fitScale = Math.min(availW / baseViewport.width, availH / baseViewport.height);
        const dpr = window.devicePixelRatio || 1;
        const viewport = page.getViewport({ scale: fitScale * dpr });

        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = (viewport.width / dpr) + 'px';
        canvas.style.height = (viewport.height / dpr) + 'px';

        try {
          await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
        } catch (e) {}
      }

      const counter = document.getElementById('counter');
      if (counter) counter.innerHTML = `<strong>${currentPage}</strong> / ${totalPages}`;
      if (!isViewer) showNotesFor(item);
      const hint = document.getElementById('video-hint');
      if (hint) hint.style.visibility = item.type === 'video' ? 'visible' : 'hidden';

      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      if (prevBtn) prevBtn.disabled = currentPage <= 1;
      if (nextBtn) nextBtn.disabled = currentPage >= totalPages;

      isRendering = false;

      if (pendingPage !== null && pendingPage !== currentPage) {
        const next = pendingPage;
        pendingPage = null;
        renderPage(next);
      } else {
        pendingPage = null;
        if (!isViewer && changed) broadcastState();
      }
    }

    function handleResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => renderPage(currentPage), 150);
    }

    // ===== Sincronização =====
    // Apresentador: envia pelo Firebase; se falhar, envia pelo ntfy.
    // Espectador: escuta os dois ao mesmo tempo e aplica a mensagem mais recente.
    let lastAppliedT = 0;
    const streams = [];
    const streamStatus = {};

    function fetchWithTimeout(url, options, ms) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      return fetch(url, { ...options, signal: ctrl.signal }).finally(() => clearTimeout(timer));
    }

    function firebaseSessionUrl() {
      return `${FIREBASE_URL.replace(/\/$/, '')}/slides/${session}.json`;
    }

    async function sendViaFirebase(payload) {
      const res = await fetchWithTimeout(firebaseSessionUrl(), {
        method: 'PUT',
        body: JSON.stringify({ ...payload, ts: { '.sv': 'timestamp' } })
      }, 4000);
      if (!res.ok) throw new Error('Firebase HTTP ' + res.status);
    }

    async function sendViaNtfy(payload) {
      const res = await fetchWithTimeout(`${NTFY_SERVER}/${getTopic()}`, {
        method: 'POST',
        body: JSON.stringify(payload)
      }, 4000);
      if (!res.ok) throw new Error('ntfy HTTP ' + res.status);
    }

    async function broadcastState() {
      const payload = { page: currentPage, t: Date.now() };
      const vs = videoState();
      if (vs) payload.video = vs;
      if (FIREBASE_URL) {
        try { await sendViaFirebase(payload); return; }
        catch (err) { console.warn('Firebase falhou, usando ntfy:', err); }
      }
      try { await sendViaNtfy(payload); }
      catch (err) {
        console.error('Broadcast failed:', err);
        showToast('Falha ao sincronizar — verifique a internet');
      }
    }

    function reportStatus(name, status, onStatusChange) {
      streamStatus[name] = status;
      const anyConnected = Object.values(streamStatus).includes('connected');
      onStatusChange && onStatusChange(anyConnected ? 'connected' : 'disconnected');
    }

    function subscribeToSync(onMessage, onStatusChange) {
      streams.forEach(es => es.close());
      streams.length = 0;

      if (FIREBASE_URL) {
        const fb = new EventSource(firebaseSessionUrl());
        const handle = (e) => {
          try {
            const msg = JSON.parse(e.data);
            if (msg && msg.path === '/' && msg.data && msg.data.page) onMessage(msg.data, 0);
          } catch (err) {}
        };
        fb.addEventListener('put', handle);
        fb.addEventListener('patch', handle);
        fb.onopen = () => reportStatus('firebase', 'connected', onStatusChange);
        fb.onerror = () => reportStatus('firebase', 'disconnected', onStatusChange);
        streams.push(fb);
      }

      const nt = new EventSource(`${NTFY_SERVER}/${getTopic()}/sse`);
      nt.onopen = () => reportStatus('ntfy', 'connected', onStatusChange);
      nt.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.event === 'message' && data.message) {
            const payload = JSON.parse(data.message);
            if (payload.page) onMessage(payload, 0);
          }
        } catch (err) {}
      };
      nt.onerror = () => reportStatus('ntfy', 'disconnected', onStatusChange);
      streams.push(nt);
    }

    async function fetchInitialFromFirebase() {
      if (!FIREBASE_URL) return null;
      try {
        const res = await fetchWithTimeout(firebaseSessionUrl(), {}, 4000);
        if (!res.ok) return null;
        const payload = await res.json();
        if (!payload || !payload.page) return null;
        const elapsed = payload.ts ? Math.min(3600, Math.max(0, (Date.now() - payload.ts) / 1000)) : 0;
        return { payload, elapsed };
      } catch (err) { return null; }
    }

    async function fetchInitialFromNtfy() {
      try {
        const res = await fetchWithTimeout(`${NTFY_SERVER}/${getTopic()}/json?poll=1&since=12h`, {}, 4000);
        if (!res.ok) return null;
        const text = await res.text();
        if (!text.trim()) return null;
        const lines = text.trim().split('\n').filter(Boolean);
        if (lines.length === 0) return null;
        const last = JSON.parse(lines[lines.length - 1]);
        if (last.event === 'message' && last.message) {
          const payload = JSON.parse(last.message);
          if (!payload.page) return null;
          // Tempo que passou desde a última mensagem (para entrar no meio de um vídeo)
          const elapsed = last.time ? Math.max(0, Date.now() / 1000 - last.time) : 0;
          return { payload, elapsed };
        }
      } catch (err) {}
      return null;
    }

    async function fetchInitialState() {
      const [fb, nt] = await Promise.all([fetchInitialFromFirebase(), fetchInitialFromNtfy()]);
      if (fb && nt) return (nt.payload.t || 0) > (fb.payload.t || 0) ? nt : fb;
      return fb || nt;
    }

    async function applyRemoteState(payload, elapsed) {
      if (payload.t) {
        if (payload.t <= lastAppliedT) return;
        lastAppliedT = payload.t;
      }
      if (payload.page !== currentPage) await renderPage(payload.page);
      const v = currentVideo();
      if (!v || !payload.video) return;
      const { playing, time } = payload.video;
      let target = time + (playing ? elapsed : 0);
      if (v.duration && target >= v.duration) target = Math.max(0, v.duration - 0.1);
      if (Math.abs(v.currentTime - target) > (playing ? 0.4 : 0.05)) {
        try { v.currentTime = target; } catch (e) {}
      }
      if (playing) playViewerVideo(v);
      else if (!v.paused) v.pause();
    }

    function playViewerVideo(v) {
      v.muted = false;
      const p = v.play();
      if (p && p.catch) {
        p.catch(() => {
          // Navegador bloqueou o som: toca mudo e mostra o botão de ativar o som
          v.muted = true;
          v.play().catch(() => {});
          const btn = document.getElementById('sound-btn');
          if (btn) btn.classList.add('show');
        });
      }
    }

    function showError(msg) {
      document.getElementById('app').innerHTML = `
        <div class="error-screen">
          <div style="color:#ef4444">Erro ao carregar</div>
          <div>${msg}</div>
        </div>
      `;
    }

    // ===== Script do apresentador =====
    // Um texto por slide/vídeo, salvo no Firebase em /notes. Só aparece na tela do apresentador.
    const notes = {};
    const notesSaveTimers = {};
    let notesKey = null;
    let notesFontSize = 18;

    function notesUrl(key) {
      return `${FIREBASE_URL.replace(/\/$/, '')}/notes${key ? '/' + key : ''}.json`;
    }

    function noteKeyFor(item) {
      return item.type === 'pdf' ? `slide-${item.page}` : `video-${item.src.replace(/\.[^.]+$/, '')}`;
    }

    function setNotesStatus(text, isError) {
      const el = document.getElementById('notes-status');
      if (!el) return;
      el.textContent = text;
      el.classList.toggle('error', !!isError);
    }

    function applyNotesFontSize() {
      const ta = document.getElementById('notes-text');
      if (ta) ta.style.fontSize = notesFontSize + 'px';
      try { localStorage.setItem('brade-notes-font', String(notesFontSize)); } catch (e) {}
    }

    function showNotesFor(item) {
      const ta = document.getElementById('notes-text');
      if (!ta || !item) return;
      notesKey = noteKeyFor(item);
      const title = document.getElementById('notes-title');
      const label = item.type === 'pdf' ? `slide ${item.page}` : `vídeo ${item.src.replace(/\.[^.]+$/, '')}`;
      if (title) title.innerHTML = `Script · <strong>${label}</strong>`;
      ta.value = notes[notesKey] || '';
      ta.scrollTop = 0;
      if (!notesSaveTimers[notesKey]) setNotesStatus('');
    }

    async function saveNote(key) {
      delete notesSaveTimers[key];
      const text = notes[key] || '';
      try {
        const res = await fetchWithTimeout(notesUrl(key), {
          method: text.trim() ? 'PUT' : 'DELETE',
          body: text.trim() ? JSON.stringify(text) : undefined
        }, 6000);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        if (key === notesKey) setNotesStatus('Salvo');
      } catch (err) {
        console.error('Falha ao salvar script:', err);
        if (key === notesKey) setNotesStatus('Não salvou — tentando de novo', true);
        notesSaveTimers[key] = setTimeout(() => saveNote(key), 4000);
      }
    }

    function applyRemoteNotes(path, data, merge) {
      const ta = document.getElementById('notes-text');
      const editing = ta && document.activeElement === ta;
      if (path === '/') {
        if (!merge) Object.keys(notes).forEach(k => { if (!notesSaveTimers[k]) delete notes[k]; });
        Object.entries(data || {}).forEach(([k, v]) => { if (!notesSaveTimers[k]) notes[k] = v; });
      } else {
        const k = path.replace(/^\//, '').split('/')[0];
        if (notesSaveTimers[k]) return;
        if (data === null) delete notes[k]; else notes[k] = data;
      }
      // Atualiza o texto na tela se alguém editou em outro computador (sem atrapalhar quem está digitando)
      if (ta && notesKey && !editing && !notesSaveTimers[notesKey]) ta.value = notes[notesKey] || '';
    }

    function setupNotes() {
      const ta = document.getElementById('notes-text');
      try {
        const saved = parseInt(localStorage.getItem('brade-notes-font'), 10);
        if (saved >= 12 && saved <= 40) notesFontSize = saved;
      } catch (e) {}
      applyNotesFontSize();
      document.getElementById('notes-smaller').addEventListener('click', () => {
        notesFontSize = Math.max(12, notesFontSize - 2); applyNotesFontSize();
      });
      document.getElementById('notes-bigger').addEventListener('click', () => {
        notesFontSize = Math.min(40, notesFontSize + 2); applyNotesFontSize();
      });
      ta.addEventListener('input', () => {
        if (!notesKey) return;
        const key = notesKey;
        notes[key] = ta.value;
        setNotesStatus('Salvando…');
        clearTimeout(notesSaveTimers[key]);
        notesSaveTimers[key] = setTimeout(() => saveNote(key), 700);
      });
      // Recebe o script salvo e acompanha edições feitas em outros computadores
      const es = new EventSource(notesUrl());
      const handle = (merge) => (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg) applyRemoteNotes(msg.path, msg.data, merge);
        } catch (err) {}
      };
      es.addEventListener('put', handle(false));
      es.addEventListener('patch', handle(true));
      es.addEventListener('cancel', () => setNotesStatus('Sem permissão para o script', true));
    }

    // ===== Apresentador =====
    async function renderPresenter() {
      document.getElementById('app').innerHTML = `
        <div class="presenter-app${FIREBASE_URL ? ' with-notes' : ''}">
          <div class="topbar">
            <div class="brand">brade.slides <span style="font-family:var(--font-mono);font-style:normal;font-size:10px;color:var(--muted);letter-spacing:.1em">TESTE</span></div>
            <div class="share-box">
              <span class="label">Link</span>
              <span class="url" id="viewer-url">${buildViewerUrl()}</span>
              <button id="copy-btn">Copiar</button>
              <button id="open-btn">Abrir</button>
            </div>
          </div>
          <div class="stage" id="stage">
            <div class="slide-canvas-wrapper"><canvas id="pdf-canvas"></canvas></div>
          </div>
          <div class="controls">
            <button class="nav-btn" id="prev-btn" aria-label="Anterior">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="counter" id="counter">— / —</div>
            <button class="nav-btn" id="next-btn" aria-label="Próximo">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
            <div class="video-hint" id="video-hint" style="visibility:hidden">Vídeo · espaço = play/pause</div>
          </div>
          <div class="notes">
            <div class="notes-head">
              <div class="notes-title" id="notes-title">Script</div>
              <span class="notes-status" id="notes-status"></span>
              <button class="notes-size" id="notes-smaller" aria-label="Diminuir letra">A−</button>
              <button class="notes-size" id="notes-bigger" aria-label="Aumentar letra">A+</button>
            </div>
            <textarea id="notes-text" spellcheck="true" placeholder="Escreva aqui o script deste slide. Salva sozinho e só aparece para quem apresenta."></textarea>
          </div>
        </div>
      `;
      createVideoElements(document.getElementById('stage'));
      document.getElementById('copy-btn').addEventListener('click', () => copyToClipboard(buildViewerUrl()));
      document.getElementById('open-btn').addEventListener('click', () => window.open(buildViewerUrl(), '_blank'));
      document.getElementById('prev-btn').addEventListener('click', () => goTo(currentPage - 1));
      document.getElementById('next-btn').addEventListener('click', () => goTo(currentPage + 1));
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        const v = currentVideo();
        if (e.key === ' ' && e.target.tagName === 'VIDEO') return; // controle nativo já trata
        if (e.key === ' ' && v) {
          e.preventDefault();
          if (v.paused) v.play(); else v.pause();
        } else if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
          e.preventDefault(); goTo(currentPage + 1);
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault(); goTo(currentPage - 1);
        }
      });
      window.addEventListener('resize', handleResize);
      if (FIREBASE_URL) setupNotes();
      try {
        await loadPdf();
        currentPage = 0;
        await renderPage(1);
      } catch (err) {
        showError(`Verifica se "${PDF_FILE}" existe nesta pasta. ${err.message}`);
      }
    }

    function goTo(pageNum) {
      if (pageNum < 1 || pageNum > totalPages) return;
      renderPage(pageNum);
    }

    // ===== Espectador =====
    function renderViewer() {
      document.getElementById('app').innerHTML = `
        <div class="viewer-app" id="stage">
          <div class="viewer-status">
            <div class="pulse" id="status-pulse"></div>
            <span id="status-text">Conectando</span>
          </div>
          <div class="slide-canvas-wrapper"><canvas id="pdf-canvas"></canvas></div>
          <button class="sound-btn" id="sound-btn">🔊 Ativar som</button>
        </div>
      `;
      createVideoElements(document.getElementById('stage'));
      document.getElementById('sound-btn').addEventListener('click', () => {
        const v = currentVideo();
        if (v) { v.muted = false; v.play().catch(() => {}); }
        document.getElementById('sound-btn').classList.remove('show');
      });
      // Qualquer toque na tela libera o áudio dos vídeos (exigência do iOS/Android)
      const unlock = () => {
        const cur = currentVideo();
        Object.values(videoEls).forEach(v => {
          if (v === cur && !v.paused) {
            v.muted = false;
            document.getElementById('sound-btn').classList.remove('show');
            return;
          }
          const p = v.play();
          if (p && p.catch) p.catch(() => {});
          v.pause();
        });
        document.removeEventListener('pointerdown', unlock, true);
        document.removeEventListener('touchend', unlock, true);
      };
      document.addEventListener('pointerdown', unlock, true);
      document.addEventListener('touchend', unlock, true);
      startViewer();
    }

    async function startViewer() {
      window.addEventListener('resize', handleResize);
      try {
        await loadPdf();
        const initial = await fetchInitialState();
        currentPage = 0;
        await renderPage(initial ? initial.payload.page : 1);
        if (initial) await applyRemoteState(initial.payload, initial.elapsed);
        subscribeToSync(
          (payload, elapsed) => applyRemoteState(payload, elapsed),
          (status) => {
            const pulse = document.getElementById('status-pulse');
            const text = document.getElementById('status-text');
            if (!pulse || !text) return;
            if (status === 'connected') {
              pulse.classList.remove('disconnected');
              text.textContent = 'Ao vivo';
            } else {
              pulse.classList.add('disconnected');
              text.textContent = 'Reconectando';
            }
          }
        );
      } catch (err) {
        showError(`Não foi possível carregar a apresentação. ${err.message}`);
      }
    }

    // Boot
    if (isViewer) renderViewer();
    else renderPresenter();
  </script>
</body>
</html>
